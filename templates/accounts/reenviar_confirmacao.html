{% extends 'base.html' %}

{% block title %}Reenviar confirmação | Recomeçar{% endblock %}

{% block content %}
<main class="mx-auto w-full max-w-2xl px-4 py-12 sm:px-6 lg:px-8">
    <section class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">Reenviar confirmação</h1>
        <p class="mt-3 text-slate-600">Informe o e-mail usado no cadastro.</p>
        <form method="post" class="mt-6 space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="rounded-xl bg-violet-700 px-5 py-3 font-bold text-white">
                Reenviar e-mail
            </button>
        </form>
    </section>
</main>
{% endblock %}
