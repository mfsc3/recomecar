{% extends 'base.html' %}
{% block title %}Redefinir senha | Recomeçar{% endblock %}
{% block content %}<section class="mx-auto max-w-xl rounded-3xl border bg-white p-8 shadow-lg"><h1 class="text-2xl font-bold">Defina uma nova senha</h1>{% if validlink %}<form method="post" class="mt-6 space-y-4">{% csrf_token %}{{ form.as_p }}<button class="rounded-xl bg-violet-700 px-5 py-3 font-bold text-white select-none transition-all duration-200 ease-in-out active:scale-95">Salvar nova senha</button></form>{% else %}<p class="mt-3 text-red-700">O link de redefinição é inválido ou expirou.</p>{% endif %}</section>{% endblock %}
