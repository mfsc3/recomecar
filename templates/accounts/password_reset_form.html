{% extends 'base.html' %}
{% block title %}Recuperar senha | Recomeçar{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-3xl border bg-white p-8 shadow-lg">
    <h1 class="text-2xl font-bold">Recuperar senha</h1>
    <p class="mt-2 text-slate-600">Se houver uma conta com este e-mail, enviaremos as instruções.</p>
    <form method="post" class="mt-6 space-y-4">{% csrf_token %}{{ form.as_p }}<button class="rounded-xl bg-violet-700 px-5 py-3 font-bold text-white">Enviar</button></form>
</section>
{% endblock %}
