{% extends 'base.html' %}
{% block title %}Escolaridade | Recomeçar{% endblock %}
{% block content %}
<main class="mx-auto max-w-3xl px-4 py-8">
  <h1 class="mb-6 text-3xl font-bold">Escolaridade</h1>
  <form method="post" class="space-y-5 rounded-2xl border bg-white p-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="rounded-xl bg-violet-700 px-5 py-3 font-bold text-white">Salvar</button>
  </form>
</main>
{% endblock %}
