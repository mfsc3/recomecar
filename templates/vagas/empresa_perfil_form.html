{% extends 'base.html' %}
{% block title %}Editar perfil da empresa | Recomeçar{% endblock %}
{% block content %}
<main class="mx-auto max-w-3xl px-4 py-8">
  <h1 class="mb-6 text-3xl font-bold">Perfil da empresa</h1>
  <form method="post" enctype="multipart/form-data" class="space-y-5 rounded-2xl border bg-white p-6">
    {% csrf_token %}
    {% if object.logo %}
      <img src="{{ object.logo.url }}" alt="Logo da empresa" class="h-24 w-24 rounded-lg object-contain">
    {% else %}
      <div class="flex h-24 w-24 items-center justify-center rounded-lg bg-slate-100 text-slate-500">Logo</div>
    {% endif %}
    {{ form.as_p }}
    <button type="submit" class="rounded-xl bg-violet-700 px-5 py-3 font-bold text-white">Salvar</button>
  </form>
</main>
{% endblock %}
