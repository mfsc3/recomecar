{% extends 'base.html' %}

{% block title %}{% if object %}Editar vaga{% else %}Nova vaga{% endif %}{% endblock %}

{% block content %}
<header class="mb-6">
    <p class="text-sm font-semibold uppercase tracking-wider text-blue-800">Área da empresa</p>
    <h1 class="mt-1 text-3xl font-bold text-slate-900">{% if object %}Editar vaga{% else %}Nova vaga{% endif %}</h1>
</header>
<form method="post" class="overscroll-contain space-y-5 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="min-h-12 w-full select-none rounded-xl bg-blue-950 px-5 py-3 font-bold text-white shadow-sm transition-all duration-200 ease-in-out active:scale-95 hover:bg-blue-900 sm:w-auto" type="submit">Salvar vaga</button>
</form>
{% endblock %}
