{% extends 'base.html' %}

{% block title %}{% if object %}Editar vaga{% else %}Nova vaga{% endif %}{% endblock %}

{% block content %}
<h1 class="mb-6 text-2xl font-bold">{% if object %}Editar vaga{% else %}Nova vaga{% endif %}</h1>
<form method="post" class="space-y-4 rounded border bg-white p-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="rounded bg-blue-700 px-4 py-2 text-white" type="submit">Salvar</button>
</form>
{% endblock %}
