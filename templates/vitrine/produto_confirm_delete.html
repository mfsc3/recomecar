{% extends 'base.html' %}

{% block title %}Excluir item | Recomeçar{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold text-slate-900">Excluir item</h1>
    <p class="mt-3 text-slate-600">Tem certeza que deseja excluir "{{ object.titulo }}"?</p>
    <form method="post" class="mt-6 flex gap-3">
        {% csrf_token %}
        <button type="submit" class="rounded-xl bg-red-700 px-5 py-3 font-semibold text-white hover:bg-red-800">Excluir</button>
        <a href="{% url 'vitrine:minha' %}" class="rounded-xl border px-5 py-3 font-semibold text-slate-700">Cancelar</a>
    </form>
</section>
{% endblock %}
